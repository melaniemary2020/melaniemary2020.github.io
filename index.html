
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f8fa;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        a {
            display: inline-block;
            background: #346b85;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="profile.jpg" alt="My professional photo">

        <h1>Your Full Name</h1>
        <h2>About Me</h2>

        <p>
            Hello! I am a graduate student interested
            in data science, analytics, and technology.
            Welcome to my personal portfolio.
        </p>

        <h2>My Resume</h2>
        <a href="resume.pdf" target="_blank">
            View My Resume
        </a>
    </div>
</body>
</html>
